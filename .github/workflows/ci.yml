name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        go:
          - "1.26.x"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build -o bin/delegate ./cmd/delegate

      - name: Test
        run: go test ./...

      - name: Race
        run: go test -race ./internal/...

      - name: Vet
        run: go vet ./...
